spring.application.name=inventory-service
server.port=8082

# inventory-service owns products + stock_reservations - a SEPARATE
# database from order-service's orderdb, reflecting real service
# ownership boundaries (each service's schema is private to it).
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/inventorydb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

spring.kafka.bootstrap-servers=localhost:9092

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.application.name=payment-service
server.port=8083

# payment-service owns payments + pending_order_amounts - its own
# database, separate from orderdb_phase2 and inventorydb.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:${user.dir}/.env[.properties],optional:file:${user.dir}/../.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/paymentdb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=localhost:9092

# --- Failure injection ---
# Comma-separated productIds that ALWAYS fail payment, deterministically.
# Empty by default (every payment succeeds). Set this to a real seeded
# productId (e.g. 2, for "Mechanical Keyboard" from inventory-service's
# data.sql) to reliably trigger the compensating rollback and watch
# inventory-service restore stock via PaymentFailedEvent.
payment.failing-product-ids=

# Random failure simulation: set to true to force random payment failures
payment.random-failure-enabled=false
payment.random-failure-rate=0.3

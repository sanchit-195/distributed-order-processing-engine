spring.application.name=payment-service
server.port=8083

# payment-service owns payments + pending_order_amounts - its own
# database, separate from orderdb_phase2 and inventorydb.
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/paymentdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=localhost:9092

# --- Failure injection ---
# Comma-separated productIds that ALWAYS fail payment, deterministically.
# Empty by default (every payment succeeds). Set this to a real seeded
# productId (e.g. 2, for "Mechanical Keyboard" from inventory-service's
# data.sql) to reliably trigger the compensating rollback and watch
# inventory-service restore stock via PaymentFailedEvent.
payment.failing-product-ids=